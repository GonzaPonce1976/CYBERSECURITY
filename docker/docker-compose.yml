services:
  # ── Wazuh Indexer (OpenSearch) ────────────────────────────────
  wazuh-indexer:
    image: wazuh/wazuh-indexer:4.7.5
    container_name: cybersec-wazuh-indexer
    restart: unless-stopped
    ports:
      - "9200:9200"
    environment:
      - "OPENSEARCH_JAVA_OPTS=-Xms512m -Xmx512m"
      - bootstrap.memory_lock=true
    ulimits:
      memlock:
        soft: -1
        hard: -1
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - wazuh-indexer-data:/var/lib/wazuh-indexer
      - ./config/wazuh/certs/indexer.pem:/usr/share/wazuh-indexer/certs/indexer.pem:ro
      - ./config/wazuh/certs/indexer-key.pem:/usr/share/wazuh-indexer/certs/indexer-key.pem:ro
      - ./config/wazuh/certs/root-ca.pem:/usr/share/wazuh-indexer/certs/root-ca.pem:ro
      - ./config/wazuh/wazuh.indexer.yml:/usr/share/wazuh-indexer/opensearch.yml:ro
    networks:
      - cybersec-net
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/9200"]
      interval: 30s
      timeout: 15s
      retries: 5

  # ── Wazuh Manager ─────────────────────────────────────────────
  wazuh-manager:
    image: wazuh/wazuh-manager:4.7.5
    container_name: cybersec-wazuh-manager
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    ports:
      - "1514:1514/udp"
      - "1515:1515"
      - "55000:55000"
    environment:
      - INDEXER_URL=https://wazuh-indexer:9200
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASS:-SecretPassword}
      - FILEBEAT_SSL_VERIFICATION_MODE=full
      - API_USERNAME=${WAZUH_API_USER:-wazuh-wui}
      - API_PASSWORD=${WAZUH_API_PASS:-MyS3cr37P450r.*}
      - SSL_CERTIFICATE_AUTHORITIES=/etc/ssl/root-ca.pem
      - SSL_CERTIFICATE=/etc/ssl/filebeat.pem
      - SSL_KEY=/etc/ssl/filebeat.key
    volumes:
      - wazuh-manager-data:/var/ossec/data
      - wazuh-manager-logs:/var/ossec/logs
      - wazuh-manager-etc:/var/ossec/etc
      - ./config/wazuh/certs/root-ca-manager.pem:/etc/ssl/root-ca.pem:ro
      - ./config/wazuh/certs/wazuh.pem:/etc/ssl/filebeat.pem:ro
      - ./config/wazuh/certs/wazuh-key.pem:/etc/ssl/filebeat.key:ro
    networks:
      - cybersec-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sk -u ${WAZUH_API_USER:-wazuh-wui}:${WAZUH_API_PASS:-MyS3cr37P450r.*} https://localhost:55000/security/user/authenticate | grep -q token"]
      interval: 30s
      timeout: 15s
      retries: 10

  # ── Wazuh Dashboard ────────────────────────────────────────────
  wazuh-dashboard:
    image: wazuh/wazuh-dashboard:4.7.5
    container_name: cybersec-wazuh-dashboard
    restart: unless-stopped
    depends_on:
      wazuh-indexer:
        condition: service_healthy
    ports:
      - "443:5601"
    environment:
      - INDEXER_USERNAME=admin
      - INDEXER_PASSWORD=${WAZUH_INDEXER_PASS:-SecretPassword}
      - WAZUH_API_URL=https://wazuh-manager
      - DASHBOARD_USERNAME=kibanaserver
      - DASHBOARD_PASSWORD=kibanaserver
    volumes:
      - ./config/wazuh/certs/dashboard.pem:/usr/share/wazuh-dashboard/certs/dashboard.pem:ro
      - ./config/wazuh/certs/dashboard-key.pem:/usr/share/wazuh-dashboard/certs/dashboard-key.pem:ro
      - ./config/wazuh/certs/root-ca.pem:/usr/share/wazuh-dashboard/certs/root-ca.pem:ro
      - ./config/wazuh/wazuh.yml:/usr/share/wazuh-dashboard/data/wazuh/config/wazuh.yml:ro
    networks:
      - cybersec-net

  # ── Rust Gateway ──────────────────────────────────────────────
  rust-gateway:
    build:
      context: ../rust-gateway
      dockerfile: Dockerfile
    container_name: cybersec-rust-gateway
    restart: unless-stopped
    depends_on:
      wazuh-manager:
        condition: service_healthy
    ports:
      - "8081:8080"
    env_file:
      - ../.env
    environment:
      - GATEWAY_HOST=0.0.0.0
      - GATEWAY_PORT=8080
      - WAZUH_API_URL=https://wazuh-manager:55000
      - DATABASE_URL=/tmp/gateway.db
    networks:
      - cybersec-net
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8080/api/health | grep -q '\"status\":\"ok\"'"]
      interval: 20s
      timeout: 10s
      retries: 5

  # ── Frontend (producción) ─────────────────────────────────────
  frontend:
    image: nginx:alpine
    container_name: cybersec-frontend
    restart: unless-stopped
    depends_on:
      rust-gateway:
        condition: service_healthy
    ports:
      - "3000:80"
    volumes:
      - ../dist/frontend:/usr/share/nginx/html:ro
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - cybersec-net

networks:
  cybersec-net:
    driver: bridge
    name: cybersec-network

volumes:
  wazuh-indexer-data:
    name: cybersec-wazuh-indexer-data
  wazuh-manager-data:
    name: cybersec-wazuh-manager-data
  wazuh-manager-logs:
    name: cybersec-wazuh-manager-logs
  wazuh-manager-etc:
    name: cybersec-wazuh-manager-etc
