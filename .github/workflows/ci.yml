name: CI — CyberSecurity DApp

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  NODE_VERSION: '20'

jobs:
  # ── Smart Contracts ─────────────────────────────────────────
  test-contracts:
    name: Smart Contracts Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Compile contracts
        run: npx hardhat compile

      - name: Run contract tests
        run: npx hardhat test

  # ── Rust Gateway ────────────────────────────────────────────
  test-gateway:
    name: Rust Gateway Build & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            rust-gateway/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('rust-gateway/Cargo.lock') }}

      - name: Check formatting
        working-directory: rust-gateway
        run: cargo fmt --check

      - name: Clippy lints
        working-directory: rust-gateway
        run: cargo clippy -- -D warnings

      - name: Build (debug)
        working-directory: rust-gateway
        run: cargo build

      - name: Run tests
        working-directory: rust-gateway
        run: cargo test

  # ── Frontend ─────────────────────────────────────────────────
  build-frontend:
    name: Frontend Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build frontend
        run: npm run build:frontend
        env:
          VITE_GATEWAY_URL: http://localhost:8080
          VITE_WS_URL: ws://localhost:8080/ws/alerts
          VITE_CHAIN_ID: '31337'
          VITE_NETWORK_NAME: 'CI Build'

      - name: Upload frontend artifact
        uses: actions/upload-artifact@v4
        with:
          name: frontend-dist
          path: dist/frontend/
          retention-days: 7

  # ── Docker Build ────────────────────────────────────────────
  build-docker:
    name: Docker Gateway Image
    runs-on: ubuntu-latest
    needs: [test-gateway]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ./rust-gateway
          push: false
          tags: cybersec-gateway:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
